<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050912;
    color:#fff;
    line-height:1.6;

.container{

    max-width:1150px;

/* NAVBAR */

.navbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(5,9,18,.88);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav-inner{
    min-height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:25px;
    font-weight:800;
}

.brand span{
    color:#159cff;
}

.logo-small{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
}

.nav-links{
    display:flex;
    gap:25px;
    font-size:14px;
    color:#cbd5e1;
}

.nav-links a:hover{
    color:#19a5ff;
}

.nav-button{
    background:#159cff;
    padding:11px 18px;
    border-radius:30px;
    font-weight:bold;
    color:white;
}

    z-index:2;
