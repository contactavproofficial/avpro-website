/* =========================
   AVPRO — GLOBAL
========================= */

:root{
    --bg:#050b14;
    --bg2:#091525;
    --card:rgba(255,255,255,.055);
    --card2:rgba(255,255,255,.08);
    --text:#f5f7fb;
    --muted:#9ba8ba;
    --blue:#1597ff;
    --cyan:#27d9ff;
    --green:#22c77a;
    --gold:#ffc928;
    --border:rgba(255,255,255,.11);
    --shadow:0 20px 60px rgba(0,0,0,.35);
    --radius:24px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 80% 10%,rgba(21,151,255,.14),transparent 28%),
        radial-gradient(circle at 10% 40%,rgba(39,217,255,.08),transparent 25%),
        var(--bg);
    color:var(--text);
    line-height:1.6;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font:inherit;
}

.container{
    width:min(1120px,92%);
    margin:auto;
}

/* =========================
   NAVBAR
========================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:999;
    background:rgba(5,11,20,.72);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.nav-inner{
    min-height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:900;
    font-size:24px;
    letter-spacing:-1px;
}

.logo-mark{
    width:44px;
    height:44px;
    border-radius:14px;
    display:grid;
    place-items:center;
    font-weight:1000;
    color:white;
    background:
        linear-gradient(135deg,#ffffff 0 35%,#128cff 36% 72%,#18d9ff 73%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    border:1px solid rgba(39,217,255,.3);
    background-color:#07111f;
}

.logo span{
    color:#1597ff;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:25px;
}

.nav-links a{
    color:#b9c4d2;
    font-size:14px;
    font-weight:700;
    transition:.25s;
}

.nav-links a:hover{
    color:white;
}

.nav-cta{
    padding:11px 17px;
    border-radius:12px;
    background:linear-gradient(135deg,#1597ff,#24cfff);
    color:#03101d!important;
    font-weight:900!important;
}

.menu-btn{
    display:none;
    background:none;
    border:0;
    color:white;
    font-size:28px;
    cursor:pointer;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    padding:150px 0 80px;
    display:flex;
    align-items:center;
    position:relative;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:60px;
    align-items:center;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border:1px solid rgba(39,217,255,.22);
    background:rgba(21,151,255,.08);
    color:#8edfff;
    border-radius:999px;
    font-size:13px;
    font-weight:800;
    margin-bottom:22px;
}
