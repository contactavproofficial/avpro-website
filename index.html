<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AVpro — Digital Growth for Local Businesses</title>

  <meta
    name="description"
    content="AVpro helps local businesses grow online with professional websites, social media, AI creatives, Google Business Profile management, video ads and local advertising."
  >

  <style>

    /* =========================
       BASIC RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080b12;
      color: #ffffff;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
    }

    .container {
      width: 90%;
      max-width: 1120px;
      margin: auto;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      padding: 20px 0;
      border-bottom: 1px solid #1d2330;

      position: sticky;
      top: 0;

      background: rgba(8, 11, 18, 0.96);

      z-index: 10;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 29px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -1px;
    }

    .logo span {
      color: #5ee7ff;
    }

    nav a {
      color: #cbd5e1;
      margin-left: 20px;
      font-size: 14px;
    }

    nav a:hover {
      color: #5ee7ff;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      padding: 105px 0 90px;
      text-align: center;

      background:
        radial-gradient(
          circle at top,
          rgba(94, 231, 255, 0.10),
          transparent 45%
        );
    }

    .tag {
      display: inline-block;

      padding: 7px 14px;

      border: 1px solid #263447;

      border-radius: 30px;

      color: #5ee7ff;

      font-size: 12px;
      font-weight: bold;

      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(42px, 8vw, 78px);
      line-height: 1.02;
      margin-bottom: 25px;
      letter-spacing: -2px;
    }

    .hero h1 span {
      color: #5ee7ff;
    }

    .hero p {
      max-width: 720px;
      margin: auto;

      color: #aab4c5;

      font-size: 19px;
    }

    .buttons {
      margin-top: 35px;
    }

    .btn {
      display: inline-block;

      padding: 15px 25px;

      border-radius: 10px;

      font-weight: 700;

      margin: 6px;
    }

    .primary {
      background: #5ee7ff;
      color: #061018;
    }

    .secondary {
      border: 1px solid #344052;
      color: white;
    }

    .primary:hover {
      background: #ffffff;
    }

    .secondary:hover {
      border-color: #5ee7ff;
      color: #5ee7ff;
    }


    /* =========================
       SMALL STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;

      max-width: 750px;

      margin: 60px auto 0;
    }

    .stat {
      background: #10151f;

      border: 1px solid #202938;

      border-radius: 14px;

      padding: 22px;
    }

    .stat strong {
      display: block;

      font-size: 22px;

      color: #ffffff;
    }

    .stat span {
      color: #7f8ba0;

      font-size: 12px;
    }


    /* =========================
       SECTIONS
    ========================= */

    section {
      padding: 80px 0;
    }

    .section-title {
      text-align: center;

      font-size: 40px;

      margin-bottom: 15px;
    }

    .section-title span {
      color: #5ee7ff;
    }

    .section-text {
      text-align: center;

      color: #9da8ba;

      max-width: 680px;

      margin: 0 auto 45px;
    }


    /* =========================
       SERVICES
    ========================= */

    .services {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 20px;
    }

    .card {
      background: #10151f;

      border: 1px solid #202938;

      padding: 30px;

      border-radius: 16px;

      transition: .25s;
    }

    .card:hover {
      transform: translateY(-5px);

      border-color: #36516e;
    }

    .card h3 {
      font-size: 21px;

      margin-bottom: 10px;
    }

    .card p {
      color: #9da8ba;

      font-size: 14px;
    }

    .number {
      color: #5ee7ff;

      font-size: 13px;

      font-weight: bold;

      margin-bottom: 15px;
    }


    /* =========================
       WHY AVPRO
    ========================= */

    .about {
      background: #0d121b;

      border-top: 1px solid #151c28;
      border-bottom: 1px solid #151c28;
    }

    .about-box {
      max-width: 850px;

      margin: auto;

      text-align: center;
    }

    .about-box p {
      color: #aab4c5;

      font-size: 18px;

      margin-bottom: 25px;
    }

    .points {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;

      margin-top: 30px;
    }

    .point {
      background: #10151f;

      border: 1px solid #202938;

      padding: 18px;

      border-radius: 12px;

      color: #cbd5e1;

      font-size: 14px;
    }

    .point span {
      color: #5ee7ff;

      font-weight: bold;
    }


    /* =========================
       PROCESS
    ========================= */

    .process {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 15px;
    }

    .step {
      background: #10151f;

      border: 1px solid #202938;

      border-radius: 15px;

      padding: 25px;
    }

    .step-number {
      color: #5ee7ff;

      font-size: 13px;

      font-weight: bold;

      margin-bottom: 25px;
    }

    .step h3 {
      margin-bottom: 8px;
    }

    .step p {
      color: #8f9bad;

      font-size: 13px;
    }


    /* =========================
       PRICING
    ========================= */

    .pricing {
      background: #0d121b;
    }

    .pricing-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 20px;
    }

    .price-card {
      background: #10151f;

      border: 1px solid #202938;

      padding: 30px;

      border-radius: 18px;
    }

    .price-card.featured {
      border-color: #5ee7ff;

      box-shadow:
        0 0 35px
        rgba(94, 231, 255, 0.08);
    }

    .price-name {
      color: #7f8ba0;

      font-size: 13px;

      font-weight: bold;

      text-transform: uppercase;
    }

    .price {
      font-size: 43px;

      font-weight: 800;

      margin: 10px 0;
    }

    .price span {
      color: #748096;

      font-size: 13px;

      font-weight: normal;
    }

    .price-card p {
      color: #8f9bad;

      font-size: 13px;

      margin-bottom: 20px;
    }

    .price-card ul {
      list-style: none;

      margin-bottom: 25px;
    }

    .price-card li {
      color: #b7c0ce;

      font-size: 13px;

      margin: 9px 0;
    }

    .price-card li:before {
      content: "✓";

      color: #5ee7ff;

      margin-right: 8px;
    }


    /* =========================
       PORTFOLIO
    ========================= */

    .portfolio {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 20px;
    }

    .project {
      min-height: 230px;

      border-radius: 17px;

      border: 1px solid #202938;

      padding: 25px;

      display: flex;

      flex-direction: column;

      justify-content: flex-end;

      background:
        linear-gradient(
          145deg,
          #152338,
          #0d121b
        );
    }

    .project:nth-child(2) {
      background:
        linear-gradient(
          145deg,
          #182b25,
          #0d121b
        );
    }

    .project:nth-child(3) {
      background:
        linear-gradient(
          145deg,
          #281d35,
          #0d121b
        );
    }

    .project-label {
      color: #5ee7ff;

      font-size: 11px;

      font-weight: bold;

      margin-bottom: 7px;
    }

    .project h3 {
      font-size: 20px;
    }

    .project p {
