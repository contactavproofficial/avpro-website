/* =========================================================
   AVPRO — PREMIUM SINGLE FILE WEBSITE
   ========================================================= */

:root{
  --bg:#050505;
  --bg2:#0a0a0a;
  --card:#101010;
  --card2:#151515;
  --white:#ffffff;
  --muted:#a7a7a7;
  --muted2:#707070;
  --line:rgba(255,255,255,.10);

  --purple:#8b5cf6;
  --blue:#3b82f6;
  --cyan:#22d3ee;
  --pink:#ec4899;

  --gradient:linear-gradient(135deg,#8b5cf6,#3b82f6,#22d3ee);
  --gradient2:linear-gradient(135deg,#ec4899,#8b5cf6,#3b82f6);

  --radius:24px;
  --max:1180px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(circle at 10% 5%,rgba(139,92,246,.13),transparent 25%),
    radial-gradient(circle at 90% 20%,rgba(34,211,238,.08),transparent 25%),
    var(--bg);

  color:var(--white);
  line-height:1.6;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

img{
  max-width:100%;
  display:block;
}

.container{
  width:min(var(--max),92%);
  margin:auto;
}

/* =========================
   BACKGROUND
   ========================= */

.bg-orb{
  position:fixed;
  width:300px;
  height:300px;
  border-radius:50%;
  filter:blur(100px);
  opacity:.10;
  pointer-events:none;
  z-index:-1;
}

.orb1{
  background:#8b5cf6;
  top:10%;
  left:-150px;
}

.orb2{
  background:#22d3ee;
  right:-150px;
  top:45%;
}

.orb3{
  background:#ec4899;
  left:20%;
  bottom:-200px;
}

/* =========================
   NAVBAR
   ========================= */

.navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;

  background:rgba(5,5,5,.72);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-bottom:1px solid rgba(255,255,255,.07);
}

.nav-inner{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  font-size:1.25rem;
  font-weight:900;
  letter-spacing:-.04em;
}

.logo-mark{
  width:38px;
  height:38px;
  border-radius:12px;

  background:var(--gradient);

  display:grid;
  place-items:center;

  font-size:1rem;
  font-weight:1000;

  box-shadow:
    0 0 25px rgba(139,92,246,.35);
}

.logo span{
  color:#fff;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:28px;
}

.nav-links a{
  color:#cfcfcf;
  font-size:.9rem;
  font-weight:600;
  transition:.25s ease;
}

.nav-links a:hover{
  color:#fff;
}

.nav-cta{
  padding:11px 18px;
  border-radius:100px;

  background:#fff;
  color:#000 !important;

  font-weight:800 !important;
}

.menu-btn{
  display:none;
  border:1px solid var(--line);
  background:#111;
  color:#fff;
  width:44px;
  height:44px;
  border-radius:13px;
  font-size:1.3
